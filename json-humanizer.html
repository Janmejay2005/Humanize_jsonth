<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Humanize — JSON, plainly</title>
<style>
  :root{
    --bg: #0b0e13;
    --panel: #11151d;
    --line: #232a36;
    --ink: #e7e4db;
    --ink-dim: #8891a1;
    --amber: #d4a24c;
    --teal: #5a9a94;
    --rose: #c1685f;
    --mono: 'IBM Plex Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'Inter', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    display:flex;
    flex-direction:column;
  }
  header{
    padding:22px 28px 16px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }
  header .brand{
    display:flex;
    align-items:baseline;
    gap:12px;
  }
  header h1{
    font-family:var(--mono);
    font-size:16px;
    font-weight:600;
    letter-spacing:0.02em;
    margin:0;
    color:var(--ink);
  }
  header h1 span{color:var(--amber);}
  header .sub{
    font-size:12.5px;
    color:var(--ink-dim);
    font-family:var(--mono);
  }
  .stats{
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--ink-dim);
    display:flex;
    gap:16px;
  }
  .stats b{color:var(--teal); font-weight:600;}
  main{
    flex:1;
    display:grid;
    grid-template-columns:1fr 46px 1fr;
    min-height:0;
  }
  .pane{
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .pane-head{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--ink-dim);
    padding:12px 20px;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .pane-head button{
    background:none;
    border:1px solid var(--line);
    color:var(--ink-dim);
    font-family:var(--mono);
    font-size:10.5px;
    padding:4px 9px;
    border-radius:3px;
    cursor:pointer;
    letter-spacing:0.05em;
  }
  .pane-head button:hover{ color:var(--ink); border-color:var(--ink-dim); }
  textarea{
    flex:1;
    resize:none;
    background:var(--panel);
    color:var(--ink);
    border:none;
    outline:none;
    padding:20px;
    font-family:var(--mono);
    font-size:13px;
    line-height:1.6;
    tab-size:2;
  }
  textarea::placeholder{color:#4a5266;}
  .divider{
    position:relative;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .divider::before{
    content:'';
    position:absolute;
    top:0; bottom:0; left:50%;
    width:1px;
    background:var(--line);
  }
  .divider .arrow{
    position:relative;
    z-index:1;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:50%;
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--amber);
    font-size:13px;
    transition:transform 0.2s ease, border-color 0.2s ease;
  }
  .divider.live .arrow{ border-color:var(--amber); }
  .output{
    flex:1;
    overflow-y:auto;
    padding:20px 22px;
    background:var(--panel);
    font-size:13.5px;
    line-height:1.7;
  }
  .output:empty::after,
  .output .empty-msg{
    content:'';
    color:var(--ink-dim);
    font-family:var(--mono);
    font-size:12.5px;
  }
  .node{ margin-left:0; }
  .row{
    display:flex;
    align-items:baseline;
    gap:8px;
    padding:3px 0;
    border-left:2px solid transparent;
  }
  .row:hover{ border-left-color:var(--line); background:rgba(255,255,255,0.015); }
  .key{
    font-family:var(--mono);
    color:var(--teal);
    font-weight:600;
    white-space:nowrap;
  }
  .key .path-note{
    color:var(--ink-dim);
    font-weight:400;
    font-style:italic;
    margin-left:6px;
    font-size:11.5px;
  }
  .val-string{ color:var(--ink); }
  .val-string::before, .val-string::after{ content:'"'; color:var(--ink-dim); }
  .val-number{ color:var(--amber); font-family:var(--mono); }
  .val-bool{ color:var(--rose); font-family:var(--mono); font-weight:600; }
  .val-null{ color:var(--ink-dim); font-family:var(--mono); font-style:italic; }
  .type-tag{
    font-family:var(--mono);
    font-size:10px;
    color:var(--ink-dim);
    border:1px solid var(--line);
    border-radius:3px;
    padding:1px 5px;
    margin-left:auto;
    white-space:nowrap;
  }
  .indent{ padding-left:22px; border-left:1px dashed var(--line); margin-left:5px; }
  .sentence{
    font-family:var(--sans);
    color:var(--ink);
    padding:2px 0 8px;
  }
  .sentence b{ color:var(--teal); font-weight:600; }
  .sentence .n{ color:var(--amber); font-family:var(--mono); }
  .section-title{
    font-family:var(--mono);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--ink-dim);
    margin:18px 0 10px;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  .section-title:first-child{ margin-top:0; padding-top:0; border-top:none; }
  .error-box{
    font-family:var(--mono);
    color:var(--rose);
    background:rgba(193,104,95,0.08);
    border:1px solid rgba(193,104,95,0.35);
    border-radius:4px;
    padding:12px 14px;
    font-size:12.5px;
    line-height:1.6;
  }
  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-track{background:var(--panel);}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:5px;}
  @media (max-width:760px){
    main{ grid-template-columns:1fr; grid-template-rows:1fr 40px 1fr; }
    .divider::before{ top:50%; bottom:auto; left:0; right:0; width:auto; height:1px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Human<span>ize</span></h1>
    <div class="sub">json → plain english, live</div>
  </div>
  <div class="stats" id="stats"></div>
</header>

<main>
  <div class="pane">
    <div class="pane-head">
      <span>Raw JSON</span>
      <button id="sampleBtn">Load sample</button>
    </div>
    <textarea id="input" spellcheck="false" placeholder='Paste JSON here, e.g.

{
  &quot;name&quot;: &quot;Janmejay&quot;,
  &quot;role&quot;: &quot;Vice President, Odyssey&quot;,
  &quot;active&quot;: true,
  &quot;skills&quot;: [&quot;Python&quot;, &quot;React&quot;, &quot;FastAPI&quot;]
}'></textarea>
  </div>

  <div class="divider" id="divider"><div class="arrow">→</div></div>

  <div class="pane">
    <div class="pane-head">
      <span>Readable</span>
      <button id="copyBtn">Copy summary</button>
    </div>
    <div class="output" id="output"></div>
  </div>
</main>

<script>
const input = document.getElementById('input');
const output = document.getElementById('output');
const stats = document.getElementById('stats');
const divider = document.getElementById('divider');
const copyBtn = document.getElementById('copyBtn');
const sampleBtn = document.getElementById('sampleBtn');

function typeOf(v){
  if(v === null) return 'null';
  if(Array.isArray(v)) return 'array';
  return typeof v;
}

function humanKey(k){
  // turn camelCase / snake_case into a readable phrase
  return k
    .replace(/_/g,' ')
    .replace(/([a-z0-9])([A-Z])/g,'$1 $2')
    .toLowerCase();
}

function renderValue(v){
  const t = typeOf(v);
  if(t === 'string') return `<span class="val-string">${escapeHtml(v)}</span>`;
  if(t === 'number') return `<span class="val-number">${v}</span>`;
  if(t === 'boolean') return `<span class="val-bool">${v}</span>`;
  if(t === 'null') return `<span class="val-null">nothing set</span>`;
  return '';
}

function escapeHtml(s){
  return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

function describeCollection(t, v){
  if(t === 'array') return `<span class="type-tag">list · ${v.length} item${v.length===1?'':'s'}</span>`;
  if(t === 'object') return `<span class="type-tag">group · ${Object.keys(v).length} field${Object.keys(v).length===1?'':'s'}</span>`;
}

function renderNode(key, value, depth){
  const t = typeOf(value);
  let html = '';

  if(t === 'object' || t === 'array'){
    html += `<div class="row"><span class="key">${key !== null ? humanKey(key) : ''}</span>${describeCollection(t, value)}</div>`;
    html += `<div class="indent">`;
    if(t === 'array'){
      value.forEach((item, i) => {
        html += renderNode(`item ${i+1}`, item, depth+1);
      });
      if(value.length === 0) html += `<div class="row"><span class="val-null">empty list</span></div>`;
    } else {
      const entries = Object.entries(value);
      entries.forEach(([k, v]) => {
        html += renderNode(k, v, depth+1);
      });
      if(entries.length === 0) html += `<div class="row"><span class="val-null">empty group</span></div>`;
    }
    html += `</div>`;
  } else {
    html += `<div class="row"><span class="key">${humanKey(key)}</span>${renderValue(value)}</div>`;
  }
  return html;
}

function buildSummary(data){
  const t = typeOf(data);
  let s = `<div class="section-title">In one line</div>`;
  if(t === 'object'){
    const keys = Object.keys(data);
    s += `<div class="sentence">This is a record with <span class="n">${keys.length}</span> field${keys.length===1?'':'s'}: <b>${keys.map(humanKey).join('</b>, <b>')}</b>.</div>`;
  } else if(t === 'array'){
    s += `<div class="sentence">This is a list of <span class="n">${data.length}</span> item${data.length===1?'':'s'}.</div>`;
  } else {
    s += `<div class="sentence">This is a single ${t} value: ${renderValue(data)}.</div>`;
  }
  return s;
}

function countNodes(data){
  let leaves = 0, groups = 0, lists = 0;
  function walk(v){
    const t = typeOf(v);
    if(t === 'object'){ groups++; Object.values(v).forEach(walk); }
    else if(t === 'array'){ lists++; v.forEach(walk); }
    else leaves++;
  }
  walk(data);
  return {leaves, groups, lists};
}

function render(){
  const raw = input.value.trim();
  if(!raw){
    output.innerHTML = `<span class="empty-msg">Nothing to translate yet — paste some JSON on the left.</span>`;
    stats.innerHTML = '';
    divider.classList.remove('live');
    return;
  }
  let data;
  try{
    data = JSON.parse(raw);
  } catch(e){
    output.innerHTML = `<div class="error-box">Can't parse this yet.<br><br>${escapeHtml(e.message)}</div>`;
    stats.innerHTML = `<span>invalid json</span>`;
    divider.classList.remove('live');
    return;
  }
  divider.classList.add('live');
  const {leaves, groups, lists} = countNodes(data);
  stats.innerHTML = `<span><b>${groups}</b> groups</span><span><b>${lists}</b> lists</span><span><b>${leaves}</b> values</span>`;

  let html = buildSummary(data);
  html += `<div class="section-title">Full breakdown</div>`;
  html += renderNode(null, data, 0);
  output.innerHTML = html;
}

input.addEventListener('input', render);

copyBtn.addEventListener('click', () => {
  const text = output.innerText;
  navigator.clipboard.writeText(text).then(() => {
    copyBtn.textContent = 'copied';
    setTimeout(() => copyBtn.textContent = 'Copy summary', 1200);
  });
});

sampleBtn.addEventListener('click', () => {
  input.value = JSON.stringify({
    name: "Janmejay",
    role: "Vice President, Odyssey",
    university: "LNCT University, Bhopal",
    active: true,
    graduationYear: 2027,
    skills: ["Python", "React", "FastAPI", "TensorRT-LLM"],
    currentProjects: [
      { title: "Mr. Grip", type: "AI voice assistant", status: "in progress" },
      { title: "Cleanytics", type: "data cleaning platform", status: "in progress" }
    ],
    mentor: null
  }, null, 2);
  render();
});

render();
</script>

</body>
</html>
